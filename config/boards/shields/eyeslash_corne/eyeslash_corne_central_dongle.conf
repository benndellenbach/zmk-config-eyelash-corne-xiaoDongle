CONFIG_PINCTRL=y
CONFIG_SPI=y
CONFIG_INPUT=y
# enable display drivers
CONFIG_ZMK_DISPLAY=y

#EXT POWER
CONFIG_ZMK_EXT_POWER=y

#BLE-passkey
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n

#BLE-clean
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=n

#Dongle should never sleep to accept peripheral connections
CONFIG_ZMK_SLEEP=n

#Fix for nice!nano bluetooth issues with ZMK v0.3 (Issue #3158)
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=n

#EC11 enable
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
CONFIG_ZMK_POINTING=y

# 3 profiles (n+2)
CONFIG_BT_MAX_CONN=6
CONFIG_BT_MAX_PAIRED=6

# dongle mode
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# display
CONFIG_ZMK_DISPLAY=y
CONFIG_BT_BAS=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_BACKLIGHT=y
CONFIG_ZMK_BACKLIGHT_BRT_START=100
CONFIG_ZMK_BACKLIGHT_ON_START=y
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=n

CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=90

CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=y
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=160
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3




# NEXUS settings for this keyboard.
#
# Nothing here requires touching NEXUS source. Merge these lines into the
# .conf that matches your dongle shield (config/sofle_dongle.conf), or keep
# them separate and include them from your build.

# --- Branding (Section 22) -------------------------------------------------
CONFIG_NEXUS_BRAND="VAIBHAV TECH"
CONFIG_NEXUS_PRODUCT="NEXUS"
CONFIG_NEXUS_SUBTITLE="SMART ZMK DONGLE"

# --- Splash (Sections 19-21) ----------------------------------------------
CONFIG_NEXUS_SPLASH=y
CONFIG_NEXUS_SPLASH_DURATION_MS=3500
# Commented out on purpose: there is no splash.png in this example, and a
# missing file is a FATAL_ERROR at configure time rather than a silent
# fallback. Drop your own PNG in nexus/splash/ and uncomment to use it; leave
# it alone for the drawn NEXUS badge. Duration 0 skips the splash entirely.
#CONFIG_NEXUS_SPLASH_IMAGE="nexus/splash/splash.png"
CONFIG_NEXUS_SPLASH_MAX_DIM=160

# --- Look (Sections 77-79) -------------------------------------------------
# NEXUS, AMOLED, DAYLIGHT, CLAY, ESPRESSO, MINT, SUNSET
CONFIG_NEXUS_THEME="NEXUS"
CONFIG_NEXUS_ANIMATIONS=y
CONFIG_NEXUS_DEFAULT_SCREEN_HOME=y
CONFIG_NEXUS_DISPLAY_ROTATION=0

# --- Sound (Section 17) ----------------------------------------------------
CONFIG_NEXUS_SOUND=y
CONFIG_NEXUS_UI_SOUND=y
CONFIG_NEXUS_GAME_SOUND=y
CONFIG_NEXUS_SOUND_STARTUP=y

# --- Games (Section 74) ----------------------------------------------------
CONFIG_NEXUS_GAME_CENTER=y
CONFIG_NEXUS_TETRIS=y
CONFIG_NEXUS_SNAKE=y
CONFIG_NEXUS_BREAKOUT=y
CONFIG_NEXUS_PACMAN=y
CONFIG_NEXUS_JUMPER=y
CONFIG_NEXUS_INVADERS=y
CONFIG_NEXUS_PONG=y
CONFIG_NEXUS_GAME_HIGHSCORE_PERSIST=y
# Difficulty is a runtime setting (Settings -> SPEED), not a build option, so
# there is nothing to set here to change how a game feels. The NEXUS_SNAKE_*
# and NEXUS_BREAKOUT_* options set what NORMAL means - see docs/games.md.

# --- Status ----------------------------------------------------------------
# ZMK numbers peripherals by pairing order. Flip this if LEFT and RIGHT show
# up the wrong way round on the dashboard.
# CONFIG_NEXUS_SPLIT_SWAP_SIDES=y

# --- Button (Section 11) ---------------------------------------------------
CONFIG_NEXUS_BUTTON_DEBOUNCE_MS=30
CONFIG_NEXUS_BUTTON_LONG_PRESS_MS=600

# --- Diagnostics -----------------------------------------------------------
# Leave off in daily use: USB logging measurably raises idle power draw.
CONFIG_NEXUS_DEBUG=n

CONFIG_NEXUS_REMOTE_INPUT=y
